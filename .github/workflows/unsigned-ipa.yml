name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS image used for the iOS SDK build
        required: true
        type: choice
        default: xcode-27-arm64
        options:
          - xcode-27-arm64
          - macos-26
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    # Xcode 27/iOS 27 is primary; macos-26 is a manual runner fallback.
    runs-on: ${{ inputs.runner || 'xcode-27-arm64' }}
    timeout-minutes: 360
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fingerprint pinned submodules
        id: pins
        shell: bash
        run: echo "value=$(git submodule status --recursive | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache cloud build stages
        uses: actions/cache@v6
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
            FEX/build-ios
            FEX/build-arm64ec
            FEX/build-wow64
            wine/build-arm64ec
            wine/build-i386
            dxmt/build-aarch64-win
            dxmt/build-arm64ec
            dxmt/build-pe-i386
            build/*/obj
            build/gnutls-ios/obj
            build/ffmpeg/obj
            build/rppairing-ios/target
            ~/Library/Caches/Homebrew
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/ccache
          key: wine-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.value }}-${{ hashFiles('ci/**', 'build/**/*.sh', 'build/**/*.py', 'app/Madeira.xcodeproj/project.pbxproj') }}
          restore-keys: |
            wine-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.value }}-

      - name: Install Rust target for built-in iOS 27 pairing
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-ios

      - name: Build native runtime
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash ci/build-ios.sh runtime 2>&1 | tee artifacts/runtime-build.log

      - name: Upload runtime stage for app packaging
        uses: actions/upload-artifact@v5
        with:
          name: madeira-runtime-stage-${{ github.run_number }}
          path: |
            artifacts/runtime-stage.tar.gz
            artifacts/runtime-build.log
          if-no-files-found: error
          retention-days: 3

  package:
    needs: runtime
    runs-on: ${{ inputs.runner || 'xcode-27-arm64' }}
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download runtime stage
        uses: actions/download-artifact@v5
        with:
          name: madeira-runtime-stage-${{ github.run_number }}
          path: artifacts/runtime-stage

      - name: Restore generated runtime files
        shell: bash
        run: |
          tar -xzf artifacts/runtime-stage/runtime-stage.tar.gz -C .
          cp artifacts/runtime-stage/runtime-build.log artifacts/runtime-build.log
          xcodebuild -downloadComponent MetalToolchain

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          bash ci/build-ios.sh package 2>&1 | tee artifacts/package-build.log

      - name: Upload IPA, build manifest, and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: madeira-unsigned-ipa-${{ github.run_number }}
          path: |
            artifacts/Madeira-unsigned.ipa
            artifacts/Madeira-unsigned.ipa.sha256
            artifacts/build-manifest.txt
            artifacts/runtime-build.log
            artifacts/package-build.log
            artifacts/xcodebuild.log
          if-no-files-found: warn
          retention-days: 30
